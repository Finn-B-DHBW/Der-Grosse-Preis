name: CI Pipeline

on:
  push:

jobs:

  # ============================================================
  # Job 1: Build
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B verify

  # ============================================================
  # Job 2: Unit-Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit

  # ============================================================
  # Job 3: Integrations-Tests
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compile test classes
        run: mvn -B test-compile

      - name: Run integration tests
        run: mvn -B failsafe:integration-test failsafe:verify

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: target/failsafe-reports/TEST-*.xml
          reporter: java-junit

  # ============================================================
  # Job 4: Code-Metriken
  #
  # Gemessene Metriken:
  #   1. Kopplung            - PMD (CouplingBetweenObjects, ExcessiveImports)
  #                            Checkstyle (ClassFanOutComplexity, CDAC)
  #   2. Kohaerenz           - PMD (GodClass, TooManyMethods, TooManyFields)
  #   3. Klassenbeziehungen  - Checkstyle (MethodCount) + Python-Quellanalyse
  #                            (extends / implements Hierarchie)
  #   4. Softwaretestmetriken- JaCoCo (Line/Branch/Method/Class Coverage)
  #                            Surefire (Testerfolgsrate)
  #
  # Ausgabe: GitHub Actions Job Summary (sichtbar im Job-Tab als Markdown)
  #          + Artifacts: metrics-reports/ (30 Tage Aufbewahrung)
  # ============================================================
  metrics:
    name: Code Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tests ausfuehren + alle Metrik-Reports generieren:
      #   verify           -> compile, test, package, jacoco:report (alle gebundenen Ziele)
      #   pmd:pmd          -> target/pmd.xml (Kopplung + Kohaerenz)
      #   checkstyle:check -> target/checkstyle-result.xml (Fan-Out, CDAC)
      #
      # pom.xml nutzt Java 21 als Compiler-Target: JaCoCo 0.8.12 unterstuetzt
      #   Java-25-Bytecode (class file version 69) nicht, Java 21 (version 65) schon.
      # -DskipITs=true: Integrationstests nicht nochmals ausfuehren.
      - name: Run tests and generate metric reports
        run: mvn -B verify pmd:pmd checkstyle:check -DskipITs=true -Dcheckstyle.failOnViolation=false -Dpmd.failOnViolation=false

      # Python-Skript parst alle XML-Reports und schreibt den Metriken-Report
      # in den GitHub Actions Job Summary (Tab "Code Metrics" > Summary)
      - name: Generate metrics summary
        run: python3 scripts/metrics-summary.py

      # Reports als herunterladbare Artifacts speichern
      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrics-reports
          path: |
            target/site/jacoco/
            target/pmd.xml
            target/checkstyle-result.xml
            target/surefire-reports/
          retention-days: 30
